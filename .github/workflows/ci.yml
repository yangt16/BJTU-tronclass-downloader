name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 入口脚本冒烟测试用：只算路径、不联网、不下载
  CI_FAKE_URL: "https://example.invalid/videos/o/site/20261111/080000-095500-1/ENCODER-x?ts=1"

jobs:
  # ---------------- Windows ----------------
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Python 测试（含下载集成测试）
        shell: bash
        run: |
          set -e
          for t in test_naming test_modes test_filter test_download test_log test_archive test_menu test_cmd_ascii test_docs test_fetch_ffmpeg test_shell; do
            echo "::group::$t"
            python "tools/$t.py"
            echo "::endgroup::"
          done

      - name: 书签脚本逻辑测试（需 Node）
        run: node tools/test_scrape.js dist/bookmarklet.txt

      - name: 入口脚本冒烟（dry-run，不下载）
        # 用 pwsh 而不是 cmd：runner 的 cmd 默认非 UTF-8，
        # 脚本里写中文文件名（1-开始下载.cmd）会乱码导致找不到文件。
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path lists | Out-Null
          Set-Content -Path 'lists\ci.txt' -Value $env:CI_FAKE_URL -Encoding utf8

          # runner 上没有 ffmpeg；dry-run 不需要真解码器，
          # 放一个假的让它通过 lectures.py 的启动检查
          New-Item -ItemType Directory -Force -Path tmp\fakebin | Out-Null
          Set-Content -Path 'tmp\fakebin\ffmpeg.cmd' -Value '@exit /b 0' -Encoding ascii
          $env:PATH = "$PWD\tmp\fakebin;$env:PATH"
          $env:GETLEC_DRYRUN = '1'
          $env:GETLEC_NOPAUSE = '1'
          $env:GETLEC_LOG = '1'

          # 拖拽等价：带清单参数 -> 跳过菜单直接跑
          $out = & '.\1-开始下载.cmd' 'lists\ci.txt' 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch '\[mode\]') { throw 'entry: no [mode] line' }
          if ($out -notmatch '\[dest\]') { throw 'entry: no [dest] line' }

          # 筛选用环境变量（20261111 是周三，3=周三命中）
          $env:GETLEC_ONLY = '3'
          $out2 = & '.\1-开始下载.cmd' 'lists\ci.txt' 2>&1 | Out-String
          Remove-Item Env:\GETLEC_ONLY -ErrorAction SilentlyContinue
          Write-Host $out2
          if ($out2 -notmatch '\[filter\]') { throw 'filter: no [filter] line' }

          # 菜单：喂两个默认回车，断言菜单有输出
          $menu = ("1`n1") | & '.\1-开始下载.cmd' 2>&1 | Out-String
          Write-Host $menu
          if ($menu -notmatch '\[menu\]') { throw 'menu: no [menu] banner' }

          if (-not (Get-ChildItem logs\*.log -ErrorAction SilentlyContinue)) {
            throw 'log: no file written'
          }
          Write-Host (Get-ChildItem logs\*.log | ForEach-Object Name)

  # ---------------- macOS ----------------
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: ffmpeg（runner 不保证预装时补上）
        run: |
          command -v ffmpeg && ffmpeg -version | head -1 || brew install ffmpeg

      - name: shell 语法检查
        run: |
          set -e
          for f in tools/*.sh *.command; do
            echo "bash -n $f"
            bash -n "$f"
          done

      - name: 实际运行首次安装与主脚本
        env:
          GETLEC_NOPAUSE: "1"
        run: |
          set -e
          printf '\n' | sh ./0-首次安装.command
          sh ./tools/getlec.sh

      - name: 入口脚本冒烟（dry-run）
        run: |
          set -e
          mkdir -p lists
          printf '%s\n' "$CI_FAKE_URL" > "lists/ci smoke.txt"
          export GETLEC_DRYRUN=1 GETLEC_NOPAUSE=1 GETLEC_LOG=1

          out=$(sh "./1-开始下载.command" "lists/ci smoke.txt" 2>&1)
          echo "$out"
          echo "$out" | grep -q "\[mode\] 视频 + 音轨"
          echo "$out" | grep -q "节:"
          ls logs/*.log >/dev/null

          out2=$(GETLEC_ONLY=3 sh "./1-开始下载.command" "lists/ci smoke.txt" 2>&1)
          echo "$out2"
          echo "$out2" | grep -q "\[filter\]"

          menu=$(printf '1\n1\n' | sh "./1-开始下载.command" 2>&1)
          echo "$menu"
          echo "$menu" | grep -q "\[menu\]"

      - name: Python 测试 + shell 入口检查（含可执行位）
        run: |
          set -e
          for t in test_naming test_modes test_filter test_download test_log test_archive test_menu test_cmd_ascii test_docs test_fetch_ffmpeg test_shell; do
            echo "::group::$t"
            python "tools/$t.py"
            echo "::endgroup::"
          done

  # ---------------- Linux（顺带验证 3.8 下限） ----------------
  test-linux:
    # ubuntu-latest 是 26.04，actions/setup-python 已不再提供 3.8；
    # 3.8 放到 ubuntu-22.04 上验证
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python-version: "3.8"
          - os: ubuntu-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: shell 语法检查
        run: |
          set -e
          for f in tools/*.sh *.command; do bash -n "$f"; done

      - name: 入口脚本冒烟（dry-run）
        run: |
          set -e
          mkdir -p lists tmp/fakebin
          printf '#!/bin/sh\nexit 0\n' > tmp/fakebin/ffmpeg
          chmod +x tmp/fakebin/ffmpeg
          export PATH="$PWD/tmp/fakebin:$PATH"
          printf '%s\n' "$CI_FAKE_URL" > lists/ci.txt
          export GETLEC_DRYRUN=1 GETLEC_NOPAUSE=1 GETLEC_LOG=1

          out=$(sh ./1-开始下载.command lists/ci.txt 2>&1)
          echo "$out"
          echo "$out" | grep -q "\[mode\] 视频 + 音轨"
          echo "$out" | grep -q "节:"
          ls logs/*.log >/dev/null

          menu=$(printf '1\n1\n' | sh ./1-开始下载.command 2>&1)
          echo "$menu"
          echo "$menu" | grep -q "\[menu\]"

      - name: Python 测试（含下载集成测试）
        run: |
          set -e
          for t in test_naming test_modes test_filter test_download test_log test_archive test_menu test_cmd_ascii test_docs test_fetch_ffmpeg test_shell; do
            echo "::group::$t"
            python "tools/$t.py"
            echo "::endgroup::"
          done

  # ---------------- 打包冒烟（不需要 ffmpeg） ----------------
  package-mac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 打 macOS 发布包并检查内容
        run: |
          set -e
          python tools/build_release.py --version ci --platform mac
          python - <<'PY'
          import glob
          import zipfile

          path = glob.glob("release/*-ci-mac.zip")[0]
          z = zipfile.ZipFile(path)
          names = z.namelist()

          assert any(n.endswith("getlec.sh") for n in names), "缺 tools/getlec.sh"
          assert any(n.endswith("menu.py") for n in names), "缺 tools/menu.py"
          assert any(n.endswith("0-首次安装.command") for n in names), "缺 0-首次安装.command"
          assert any(n.endswith("1-开始下载.command") for n in names), "缺 1-开始下载.command"
          assert any(n.endswith("dist/bookmarks.html") for n in names), "缺 bookmarks.html"
          assert any(n.endswith("/lists/") for n in names), "缺 lists/ 空目录"

          modes = {
              i.filename.split("/")[-1]: oct((i.external_attr >> 16) & 0o777)
              for i in z.infolist()
              if i.filename.endswith((".sh", ".command"))
          }
          assert modes, "包里没有 shell 脚本"
          bad = {k: v for k, v in modes.items() if v != "0o755"}
          assert not bad, f"可执行位不对: {bad}"

          print(f"ok: {len(names)} 个条目，{len(modes)} 个脚本均为 0o755")
          PY
